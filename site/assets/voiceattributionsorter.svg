<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="948" viewBox="0 0 1660 948" role="img" aria-labelledby="title desc">
  <title id="title">Voice attribution sorter</title>
  <desc id="desc">A speech signal enters an attribution review that separates observed, reported, inferred, and promised statements before a reviewed CRM note is committed.</desc>
  <rect width="1660" height="948" fill="#080807"/>
  <g stroke="#f4eee3" stroke-opacity="0.08">
    <path d="M0 118H1660M0 236H1660M0 354H1660M0 472H1660M0 590H1660M0 708H1660M0 826H1660"/>
    <path d="M118 0V948M236 0V948M354 0V948M472 0V948M590 0V948M708 0V948M826 0V948M944 0V948M1062 0V948M1180 0V948M1298 0V948M1416 0V948M1534 0V948"/>
  </g>
  <text x="96" y="104" fill="#c8ff37" font-family="monospace" font-size="22" letter-spacing="4">VOICE ATTRIBUTION</text>
  <text x="96" y="192" fill="#f4eee3" font-family="Arial, sans-serif" font-size="64" font-weight="700">CAPTURE THE WORDS.</text>
  <text x="96" y="264" fill="#f4eee3" font-family="Georgia, serif" font-size="54" font-style="italic">Preserve who said what.</text>
  <g transform="translate(96 414)" fill="#f4eee3">
    <rect x="0" y="66" width="12" height="42" rx="6"/>
    <rect x="30" y="40" width="12" height="94" rx="6"/>
    <rect x="60" y="14" width="12" height="146" rx="6"/>
    <rect x="90" y="48" width="12" height="78" rx="6"/>
    <rect x="120" y="0" width="12" height="174" rx="6" fill="#c8ff37"/>
    <rect x="150" y="48" width="12" height="78" rx="6"/>
    <rect x="180" y="14" width="12" height="146" rx="6"/>
    <rect x="210" y="40" width="12" height="94" rx="6"/>
    <rect x="240" y="66" width="12" height="42" rx="6"/>
  </g>
  <path d="M370 501H452" stroke="#f4eee3" stroke-width="8"/>
  <g transform="translate(452 360)">
    <rect width="330" height="290" fill="none" stroke="#c8ff37" stroke-width="8"/>
    <text x="42" y="72" fill="#c8ff37" font-family="monospace" font-size="18" letter-spacing="3">ATTRIBUTION REVIEW</text>
    <text x="42" y="146" fill="#f4eee3" font-family="Arial, sans-serif" font-size="44" font-weight="700">LABEL</text>
    <text x="42" y="198" fill="#f4eee3" font-family="Arial, sans-serif" font-size="44" font-weight="700">BEFORE</text>
    <text x="42" y="250" fill="#f4eee3" font-family="Arial, sans-serif" font-size="44" font-weight="700">COMMIT</text>
  </g>
  <path d="M782 501H852" stroke="#c8ff37" stroke-width="8"/>
  <g transform="translate(852 350)">
    <rect x="0" y="0" width="190" height="130" fill="#c8ff37"/>
    <rect x="206" y="0" width="190" height="130" fill="#f4eee3"/>
    <rect x="0" y="146" width="190" height="130" fill="#f4eee3"/>
    <rect x="206" y="146" width="190" height="130" fill="#f4eee3"/>
    <text x="22" y="76" fill="#11100e" font-family="Arial, sans-serif" font-size="24" font-weight="700">OBSERVED</text>
    <text x="228" y="76" fill="#11100e" font-family="Arial, sans-serif" font-size="24" font-weight="700">REPORTED</text>
    <text x="22" y="222" fill="#11100e" font-family="Arial, sans-serif" font-size="24" font-weight="700">INFERRED</text>
    <text x="228" y="222" fill="#11100e" font-family="Arial, sans-serif" font-size="24" font-weight="700">PROMISED</text>
  </g>
  <path d="M1248 501H1310" stroke="#c8ff37" stroke-width="8"/>
  <path d="M1310 501L1278 478V524Z" fill="#c8ff37"/>
  <g transform="translate(1320 360)">
    <rect width="244" height="290" rx="10" fill="#f4eee3"/>
    <text x="28" y="52" fill="#11100e" font-family="monospace" font-size="17" letter-spacing="2">CRM NOTE</text>
    <path d="M30 92H214M30 136H190M30 180H214" stroke="#11100e" stroke-width="6"/>
    <circle cx="68" cy="236" r="26" fill="#c8ff37"/>
    <path d="M54 236L65 248L84 222" fill="none" stroke="#11100e" stroke-width="6"/>
    <text x="108" y="245" fill="#11100e" font-family="Arial, sans-serif" font-size="22" font-weight="700">REVIEWED</text>
  </g>
  <text x="96" y="828" fill="#f4eee3" font-family="Arial, sans-serif" font-size="28">Voice draft</text>
  <text x="250" y="828" fill="#c8ff37" font-family="Arial, sans-serif" font-size="28">→</text>
  <text x="296" y="828" fill="#f4eee3" font-family="Arial, sans-serif" font-size="28">Source label</text>
  <text x="474" y="828" fill="#c8ff37" font-family="Arial, sans-serif" font-size="28">→</text>
  <text x="520" y="828" fill="#f4eee3" font-family="Arial, sans-serif" font-size="28">Factual review</text>
  <text x="718" y="828" fill="#c8ff37" font-family="Arial, sans-serif" font-size="28">→</text>
  <text x="764" y="828" fill="#f4eee3" font-family="Arial, sans-serif" font-size="28">Human commit</text>
  <text x="972" y="828" fill="#c8ff37" font-family="Arial, sans-serif" font-size="28">→</text>
  <text x="1018" y="828" fill="#f4eee3" font-family="Arial, sans-serif" font-size="28">Accountable record</text>
</svg>
