      <rect y="96" width="270" height="58" fill="#c8ff37"/>
      <text x="22" y="58" fill="#f4eee3" font-family="monospace" font-size="18">ANNOUNCEMENT</text>
      <text x="135" y="134" text-anchor="middle" fill="#080807" font-family="Arial, sans-serif" font-size="23" font-weight="700">WATCH</text>
    </g>
    <g transform="translate(292 180)">
      <rect width="270" height="156" fill="none" stroke="#f4eee3" stroke-width="5"/>
      <rect y="156" width="270" height="58" fill="#c8ff37"/>
      <text x="22" y="58" fill="#f4eee3" font-family="monospace" font-size="18">DOCUMENTATION</text>
      <text x="135" y="194" text-anchor="middle" fill="#080807" font-family="Arial, sans-serif" font-size="23" font-weight="700">DESIGN</text>
    </g>
    <g transform="translate(584 120)">
      <rect width="270" height="216" fill="none" stroke="#f4eee3" stroke-width="5"/>
      <rect y="216" width="270" height="58" fill="#c8ff37"/>
      <text x="22" y="58" fill="#f4eee3" font-family="monospace" font-size="18">CONTROLLED TEST</text>
      <text x="135" y="254" text-anchor="middle" fill="#080807" font-family="Arial, sans-serif" font-size="23" font-weight="700">PILOT</text>
    </g>
    <g transform="translate(876 60)">
      <rect width="270" height="276" fill="none" stroke="#f4eee3" stroke-width="5"/>
      <rect y="276" width="270" height="58" fill="#c8ff37"/>
      <text x="22" y="58" fill="#f4eee3" font-family="monospace" font-size="17">PRODUCTION RECORD</text>
      <text x="135" y="314" text-anchor="middle" fill="#080807" font-family="Arial, sans-serif" font-size="23" font-weight="700">OPERATE</text>
    </g>
    <g transform="translate(1168 0)">
      <rect width="270" height="336" fill="#f4eee3"/>
      <rect y="336" width="270" height="58" fill="#c8ff37"/>
      <text x="22" y="58" fill="#080807" font-family="monospace" font-size="17">MEASURED OUTCOME</text>
      <text x="22" y="106" fill="#080807" font-family="Arial, sans-serif" font-size="25" font-weight="700">Strongest load</text>
      <text x="22" y="142" fill="#080807" font-family="Arial, sans-serif" font-size="25" font-weight="700">requires context</text>
      <text x="135" y="374" text-anchor="middle" fill="#080807" font-family="Arial, sans-serif" font-size="23" font-weight="700">EXPAND</text>
    </g>
