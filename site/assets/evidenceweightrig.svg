<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="948" viewBox="0 0 1660 948" role="img" aria-labelledby="title desc">
  <title id="title">Evidence weight rig</title>
  <desc id="desc">Five evidence blocks carry increasingly consequential AI decisions from watch to expand.</desc>
  <rect width="1660" height="948" fill="#080807"/>
  <g stroke="#f4eee3" stroke-opacity="0.08">
    <path d="M0 118H1660M0 236H1660M0 354H1660M0 472H1660M0 590H1660M0 708H1660M0 826H1660"/>
    <path d="M118 0V948M236 0V948M354 0V948M472 0V948M590 0V948M708 0V948M826 0V948M944 0V948M1062 0V948M1180 0V948M1298 0V948M1416 0V948M1534 0V948"/>
  </g>
  <text x="96" y="100" fill="#c8ff37" font-family="monospace" font-size="22" letter-spacing="4">EVIDENCE WEIGHT</text>
  <text x="96" y="188" fill="#f4eee3" font-family="Arial, sans-serif" font-size="62" font-weight="700">A LINK PROVES ORIGIN.</text>
  <text x="96" y="260" fill="#f4eee3" font-family="Georgia, serif" font-size="54" font-style="italic">Scope sets the decision.</text>
  <g transform="translate(96 372)">
    <g transform="translate(0 240)">
