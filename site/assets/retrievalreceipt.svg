<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="948" viewBox="0 0 1660 948" role="img" aria-labelledby="title desc">
  <title id="title">Retrieval receipt for an AI answer</title>
  <desc id="desc">A client question moves through candidate records, version and access gates, and reaches a receipt showing the selected source and named decision owner.</desc>
  <rect width="1660" height="948" fill="#080807"/>
  <circle cx="1335" cy="154" r="210" fill="#502C52" opacity=".42"/>
  <circle cx="1420" cy="850" r="290" fill="#C95F37" opacity=".15"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#F4EEE3">
    <text x="92" y="150" font-size="24" font-weight="800" letter-spacing="4">AI, PLAIN ENGLISH · POST 015</text>
    <text x="92" y="226" font-family="Georgia, serif" font-size="62" font-weight="700">The retrieval receipt</text>
    <text x="92" y="286" font-size="29" fill="#C8FF37">Similarity is not authority.</text>
  </g>
  <g transform="translate(92 360)">
    <rect width="274" height="132" fill="#C8FF37" stroke="#080807" stroke-width="8"/>
    <text x="137" y="54" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="900" letter-spacing="2" fill="#080807">CLIENT QUESTION</text>
    <text x="137" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#080807">Can we waive the fee?</text>
    <path d="M274 66 H420" stroke="#C8FF37" stroke-width="14"/>
    <circle cx="436" cy="66" r="25" fill="#C8FF37" stroke="#F4EEE3" stroke-width="8"/>
    <path d="M452 66 C540 66 526 20 650 20" fill="none" stroke="#C95F37" stroke-width="11"/>
    <path d="M452 66 C540 66 526 130 650 130" fill="none" stroke="#502C52" stroke-width="11"/>
    <path d="M452 66 C540 66 526 260 650 260" fill="none" stroke="#C8FF37" stroke-width="14"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="650" y="-42" width="264" height="124" fill="#F4EEE3" stroke="#080807" stroke-width="8"/>
      <text x="680" y="-2" font-size="14" font-weight="900" letter-spacing="2" fill="#080807">RANK ONE</text>
      <text x="680" y="38" font-family="Georgia, serif" font-size="27" font-weight="700" fill="#080807">Old guide</text>
      <rect x="800" y="51" width="92" height="24" fill="#C95F37"/>
      <text x="846" y="68" text-anchor="middle" font-size="11" font-weight="900" fill="#F4EEE3">EXPIRED</text>
      <rect x="650" y="68" width="264" height="124" fill="#F4EEE3" stroke="#080807" stroke-width="8"/>
      <text x="680" y="108" font-size="14" font-weight="900" letter-spacing="2" fill="#080807">RANK TWO</text>
      <text x="680" y="148" font-family="Georgia, serif" font-size="27" font-weight="700" fill="#080807">Private contract</text>
      <rect x="782" y="155" width="110" height="24" fill="#502C52"/>
      <text x="837" y="172" text-anchor="middle" font-size="11" font-weight="900" fill="#F4EEE3">RESTRICTED</text>
      <rect x="650" y="198" width="264" height="124" fill="#F4EEE3" stroke="#C8FF37" stroke-width="8"/>
      <text x="680" y="238" font-size="14" font-weight="900" letter-spacing="2" fill="#080807">RANK THREE</text>
      <text x="680" y="278" font-family="Georgia, serif" font-size="27" font-weight="700" fill="#080807">Current policy</text>
      <rect x="790" y="285" width="102" height="24" fill="#C8FF37"/>
      <text x="841" y="302" text-anchor="middle" font-size="11" font-weight="900" fill="#080807">SELECTED</text>
    </g>
    <path d="M914 260 H1040" stroke="#C8FF37" stroke-width="14"/>
  </g>
  <g transform="translate(1132 298)" font-family="Arial, Helvetica, sans-serif">
    <rect width="436" height="488" fill="#F4EEE3" stroke="#C8FF37" stroke-width="9"/>
    <text x="34" y="58" fill="#080807" font-size="18" font-weight="900" letter-spacing="3">RETRIEVAL RECEIPT</text>
    <rect x="315" y="28" width="87" height="39" fill="#C8FF37"/>
    <text x="359" y="53" text-anchor="middle" fill="#080807" font-size="12" font-weight="900">REVIEW</text>
    <line x1="34" y1="85" x2="402" y2="85" stroke="#080807" stroke-width="3" opacity=".24"/>
    <g fill="#080807" font-size="18">
      <text x="34" y="128" opacity=".6">Selected record</text><text x="250" y="128" font-weight="800">Current policy</text>
      <text x="34" y="176" opacity=".6">Version</text><text x="250" y="176" font-weight="800">Effective</text>
      <text x="34" y="224" opacity=".6">Access scope</text><text x="250" y="224" font-weight="800">Allowed</text>
      <text x="34" y="272" opacity=".6">Passage</text><text x="250" y="272" font-weight="800">Visible</text>
      <text x="34" y="320" opacity=".6">Filters</text><text x="250" y="320" font-weight="800">Recorded</text>
      <text x="34" y="368" opacity=".6">Exception</text><text x="250" y="368" font-weight="800" fill="#C95F37">One fact missing</text>
      <text x="34" y="416" opacity=".6">Decision owner</text><text x="250" y="416" font-weight="800" fill="#502C52">Named person</text>
    </g>
    <rect x="34" y="449" width="368" height="17" fill="#C8FF37"/>
  </g>
  <text x="92" y="870" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#F4EEE3" opacity=".68">Proposed operating model by Ahmad Bukhari</text>
</svg>
